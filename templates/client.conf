# ==========================================
# QuarkShield Quantum-Safe VPN Client Config
# ==========================================

client
dev tun
proto udp

# Replace this with your corporate VPN Gateway public IP or domain
remote vpn.quarkshield.services 1194

resolv-retry infinite
nobind

# Keep credentials persistent across re-connections
persist-key
persist-tun

# Certificates and private key paths
# These credentials should be generated using a post-quantum signature algorithm (e.g. ML-DSA-65)
ca certs/ca.crt
cert certs/client.crt
key certs/client.key
remote-cert-tls server

# Post-Quantum & Hybrid Key Exchange parameters (must match server configs)
# Forces the client to negotiate connection using ECDH (x25519) combined with NIST ML-KEM (Kyber768)
tls-groups x25519_kyber768:p256_kyber768
tls-version-min 1.3
tls-ciphersuites TLS_AES_256_GCM_SHA384

# Data tunnel cipher matching the gateway
cipher AES-256-GCM
auth SHA256

# Compression & Speed optimization
compress lz4-v2

# Logging detail level
verb 3
mute-replay-warnings
