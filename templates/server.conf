# ==========================================
# QuarkShield Quantum-Safe VPN Server Config
# ==========================================

# Port and protocol
port 1194
proto udp
dev tun

# Cryptographic Certificate Authorities and Keys
# Note: These should be signed using a post-quantum signature algorithm (e.g. ML-DSA-65)
ca /etc/openvpn/certs/ca.crt
cert /etc/openvpn/certs/server.crt
key /etc/openvpn/certs/server.key
dh none  # DH is not used as we rely exclusively on PQC/Hybrid Key Exchange

# Network Topologies
server 10.8.0.0 255.255.255.0
topology subnet
ifconfig-pool-persist ipp.txt

# Post-Quantum & Hybrid Key Exchange parameters (Open Quantum Safe integration)
# We configure OpenVPN to require hybrid ECDH + ML-KEM key exchange.
# x25519_kyber768 provides 128-bit quantum security coupled with classical ECDH safety.
tls-groups x25519_kyber768:p256_kyber768:p384_kyber1024

# Restrict to secure TLS 1.3 ciphersuites
tls-version-min 1.3
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# Symmetric Encryption for Data Tunnel
cipher AES-256-GCM
auth SHA256

# Keepalive and reliability
keepalive 10 120
persist-key
persist-tun

# Push routing directives to clients (corporate network routes)
push "redirect-gateway def1 bypass-dhcp"
push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 8.8.8.8"

# Logging and Diagnostics
status /var/log/openvpn/openvpn-status.log
log-append /var/log/openvpn/openvpn.log
verb 3
explicit-exit-notify 1
